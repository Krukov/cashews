[pytest]
addopts = --disable-pytest-warnings -vv --showlocals
testpaths = tests
markers =
    redis: mark test as requiring `redis` library
    redis_cluster: mark test as requiring a Redis Cluster setup
    redis_sentinel: mark test as requiring a Redis Sentinel setup
    diskcache: mark test as requiring `diskcache` library
    integration: mark test as integrational (test with one of the web frameworks)
asyncio_mode = auto
